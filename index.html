<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>4 Veces 10</title>
  <style>
    body,
    html {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: black;
      height: 100%;
      width: 100%;
    }

    #glcanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    #input_video {
      display: none;
    }

    #source_video {
      filter: grayscale(1) contrast(1.5) hue-rotate(300deg);
    }

    #startScreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    #startButton {
      padding: 20px 60px;
      font-size: 24px;
      font-weight: 600;
      color: #000000;
      /* background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); */
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    #startButton:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 40px rgba(102, 126, 234, 0.6);
    }

    #startButton:active {
      transform: translateY(0);
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tone@latest/build/Tone.js"></script>
</head>

<body>
  <div id="startScreen">
    <button id="startButton">Iniciar</button>
  </div>
  
  <canvas id="glcanvas"></canvas>
  <video id="input_video" playsinline></video>
  <video id="source_video" preload="none" muted loop playsinline style="display:none;"></video>
  <script src="script.js"></script>
</body>

</html>
